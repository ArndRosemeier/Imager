<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Imager — a local-first image generation and refinement app powered by OpenRouter."
    />
    <title>Imager</title>
    <!--
      Icons. The SVG comes first so browsers that support it get the crisp
      vector at every size; the PNGs are the fallback, and `apple-touch-icon` is
      what iOS reads when the app is added to the home screen (it does not read
      SVG favicons). The paths are RELATIVE on purpose: the app is served under
      a subpath (`/imager/`), so a root-absolute `/favicon.svg` would 404 there.
      Vite copies `public/` to the build root; the PNGs are generated from
      `public/favicon.svg` by `scripts/renderIcons.mjs`.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      THE anti-flash theme bootstrap — the ONE inline script in this app.
      It must run BEFORE first paint: a persisted "light" choice has to be on
      <html> already, otherwise the dark default paints first and the app
      flashes. The key and the default MUST agree with src/lib/theme.ts
      (pinned by tests/architecture/theme-startup.test.ts). localStorage is the
      source of truth precisely because it is readable synchronously here.
      Everything else (applying, persisting, watching) lives in src/lib/theme.ts.
    -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem('imager.theme');
        } catch (error) {
          stored = null;
        }
        var theme = stored === 'light' ? 'light' : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
