<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Imager">
  <!--
    Imager's icon: a sun over a mountain, on the app's indigo→violet accent.

    WHY IT IS THIS SIMPLE. A first version drew a full picture FRAME (white
    border + pale interior + sun + two hills). Rendered at 16px — the size a
    favicon is actually seen at — the frame, the interior, the two hills and the
    sun collapsed into an unreadable blob. The mark was redrawn with fewer,
    LARGER shapes and no frame: one sun, one mountain, on the accent field. It
    survives 16px because nothing in it is smaller than ~4px at that size.

    Geometry: the sun sits in the sky the mountain leaves free (no overlap, so
    neither shape reads as a bite out of the other), and the mountain's base is
    inset from the rounded field, so the silhouette stays clear of the corners.
    Plain shapes only — nothing depends on stroke or font rendering.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)" />

  <!-- Sun: big enough to hold its shape at 16px (4px), and clear of the peak
       (the first draft clipped the mountain's edge, which read as a bite). -->
  <circle cx="44" cy="20" r="8" fill="#fbbf24" />

  <!-- One mountain, spanning the field with a generous base inset. -->
  <path d="M 8 50 L 30 18 L 56 50 Z" fill="#ffffff" />
</svg>
